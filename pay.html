<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Stay Here PR — Payment</title>
<script src="config.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --brand:#0ea5a4; --brand-dk:#0b8281; --line:#e2e8f0; --ok:#16a34a; --warn:#b45309;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f172a 0%,#134e4a 100%);
    color:var(--ink); min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border-radius:20px;
    box-shadow:0 18px 50px rgba(2,6,23,.35); overflow:hidden;
  }
  .head{ padding:22px 24px 16px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:800; letter-spacing:.2px; color:var(--brand-dk); font-size:15px; }
  .brand small{ color:var(--muted); font-weight:600 }
  .body{ padding:22px 24px 26px; }
  h1{ font-size:20px; margin:2px 0 4px; }
  .prop{ color:var(--muted); font-size:14px; margin:0 0 18px; }
  .price{
    display:flex; align-items:baseline; gap:8px; margin:0 0 4px;
  }
  .price b{ font-size:34px; letter-spacing:-.5px; }
  .price span{ color:var(--muted); font-size:13px; }
  .hold{
    background:#f0fdfa; border:1px solid #99f6e4; color:#0f766e;
    border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.45; margin:14px 0 18px;
  }
  label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  input[type=text]{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
    font-size:16px; -webkit-appearance:none; appearance:none; min-width:0;
  }
  .row{ margin-bottom:16px }
  button{
    width:100%; border:0; border-radius:14px; padding:15px 16px; font-size:16px; font-weight:700;
    cursor:pointer; background:var(--brand); color:#fff; transition:background .15s;
  }
  button:hover{ background:var(--brand-dk) }
  button:disabled{ opacity:.6; cursor:default }
  .secure{ text-align:center; color:var(--muted); font-size:12px; margin:14px 0 0; }
  .msg{ text-align:center; padding:8px 0 0 }
  .msg .ico{ font-size:44px; line-height:1; margin-bottom:8px }
  .msg h1{ margin:6px 0 6px }
  .msg p{ color:var(--muted); font-size:14.5px; line-height:1.5; margin:0 0 16px }
  .err{ color:#b91c1c; font-size:13.5px; text-align:center; margin:10px 0 0 }
  .link{ background:transparent; color:var(--brand-dk); text-decoration:underline; padding:6px }
  .skeleton{ color:var(--muted); text-align:center; padding:26px 0 }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">Stay&nbsp;Here&nbsp;PR <small>· Guest services</small></div>
    </div>
    <div class="body" id="body">
      <div class="skeleton" id="loading">…</div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var FN = (window.SUPABASE_URL || "") + "/functions/v1/upsell-create-checkout";
  var ANON = window.SUPABASE_ANON_KEY || "";
  var qs = new URLSearchParams(location.search);
  var token = qs.get("token") || "";
  var status = qs.get("status") || "";
  var body = document.getElementById("body");

  // Diccionario bilingüe. El idioma llega del backend (info.language); default en.
  var L = "en";
  var T = {
    en:{
      title:{early_checkin:"Early check-in", late_checkout:"Late check-out", extra_night:"Extra night"},
      each:"one-time",
      hold:"You’ll only be <b>authorized</b> now — we charge the card <b>only when our team approves</b>. If we can’t accommodate it, the hold is released and you’re not charged.",
      timeLabel:{early_checkin:"Desired check-in time", late_checkout:"Desired check-out time", extra_night:"Note (optional)"},
      timePh:"e.g. 2:00 PM",
      pay:"Pay & request",
      secure:"Secured by Stripe · we never see your card",
      okTitle:"Thank you!",
      okMsg:"Your payment is authorized. We’ll confirm your service as soon as our team approves it. 🙂",
      cancelTitle:"Payment not completed",
      cancelMsg:"No problem — you can complete it whenever you’re ready.",
      retry:"Try again",
      badToken:"This link is no longer valid. Please contact us and we’ll help you out.",
      noPrice:"This service isn’t available to pay online right now. Please contact us.",
      already:"We already have a payment in process for this request. Thank you!",
      genErr:"Something went wrong. Please try again in a moment."
    },
    es:{
      title:{early_checkin:"Early check-in", late_checkout:"Late check-out", extra_night:"Noche extra"},
      each:"pago único",
      hold:"Por ahora solo se <b>autoriza</b> — cobramos la tarjeta <b>únicamente cuando el equipo aprueba</b>. Si no podemos acomodarlo, la retención se libera y no se te cobra.",
      timeLabel:{early_checkin:"Hora de entrada deseada", late_checkout:"Hora de salida deseada", extra_night:"Nota (opcional)"},
      timePh:"ej. 2:00 PM",
      pay:"Pagar y solicitar",
      secure:"Protegido por Stripe · nunca vemos tu tarjeta",
      okTitle:"¡Gracias!",
      okMsg:"Tu pago quedó autorizado. Confirmamos tu servicio en cuanto el equipo lo apruebe. 🙂",
      cancelTitle:"Pago no completado",
      cancelMsg:"Sin problema — puedes completarlo cuando gustes.",
      retry:"Reintentar",
      badToken:"Este enlace ya no es válido. Escríbenos y te ayudamos.",
      noPrice:"Este servicio no está disponible para pago en línea ahora mismo. Escríbenos.",
      already:"Ya tenemos un pago en proceso para esta solicitud. ¡Gracias!",
      genErr:"Algo salió mal. Intenta de nuevo en un momento."
    }
  };
  function t(){ return T[L]; }

  function money(cents, cur){
    try{ return new Intl.NumberFormat(L==="es"?"es-PR":"en-US",{style:"currency",currency:(cur||"usd").toUpperCase()}).format(cents/100); }
    catch(e){ return "$"+(cents/100).toFixed(2); }
  }
  function api(payload){
    return fetch(FN,{
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":ANON, "Authorization":"Bearer "+ANON },
      body:JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function showMsg(icon, title, msg, withRetry){
    body.innerHTML =
      '<div class="msg"><div class="ico">'+icon+'</div><h1>'+esc(title)+'</h1><p>'+msg+'</p>'+
      (withRetry?'<button class="link" id="retry">'+esc(t().retry)+'</button>':'')+'</div>';
    if(withRetry){ document.getElementById("retry").onclick=function(){ location.search="?token="+encodeURIComponent(token); }; }
  }

  function renderForm(info){
    var kind = info.kind;
    var tl = t().timeLabel[kind] || t().timeLabel.late_checkout;
    var cur = info.currency || 'usd';
    var tiers = (info.tiers && info.tiers.length) ? info.tiers : null;

    var priceHtml, controlHtml;
    if(tiers){
      // Early/Late por hora: el huésped elige un tramo (label + precio); el precio se actualiza.
      var opts = tiers.map(function(tr,i){ return '<option value="'+i+'">'+esc(tr.label)+' — '+money(tr.amountCents,cur)+'</option>'; }).join('');
      priceHtml = '<div class="price"><b id="px">'+money(tiers[0].amountCents,cur)+'</b><span>'+esc(t().each)+'</span></div>';
      controlHtml = '<div class="row"><label for="tsel">'+esc(tl)+'</label>'+
        '<select id="tsel" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;-webkit-appearance:none;appearance:none">'+opts+'</select></div>';
    } else {
      priceHtml = '<div class="price"><b id="px">'+money(info.amountCents,cur)+'</b><span>'+esc(t().each)+'</span></div>';
      controlHtml = '<div class="row"><label for="tm">'+esc(tl)+'</label>'+
        '<input type="text" id="tm" placeholder="'+esc(t().timePh)+'" value="'+esc(info.requestedTime||"")+'" /></div>';
    }
    body.innerHTML =
      '<h1>'+esc(t().title[kind]||info.service)+'</h1>'+
      '<p class="prop">'+esc(info.propertyName||"")+'</p>'+
      priceHtml+
      '<div class="hold">'+t().hold+'</div>'+
      controlHtml+
      '<button id="pay">'+esc(t().pay)+'</button>'+
      '<div class="err" id="err" style="display:none"></div>'+
      '<p class="secure">'+esc(t().secure)+'</p>';
    if(tiers){
      var selEl=document.getElementById("tsel"), px=document.getElementById("px");
      selEl.onchange=function(){ px.textContent=money(tiers[+selEl.value].amountCents,cur); };
    }
    var btn=document.getElementById("pay"), err=document.getElementById("err");
    btn.onclick=function(){
      btn.disabled=true; err.style.display="none";
      var payload={token:token};
      if(tiers){ payload.minutes=tiers[+document.getElementById("tsel").value].minutes; }
      else { payload.time=(document.getElementById("tm").value||"").trim(); }
      api(payload).then(function(res){
        if(res.ok && res.j && res.j.url){ location.href=res.j.url; return; }
        btn.disabled=false;
        err.textContent = (res.status===409? t().already : t().genErr);
        err.style.display="block";
      }).catch(function(){ btn.disabled=false; err.textContent=t().genErr; err.style.display="block"; });
    };
  }

  // ── Arranque ──────────────────────────────────────────────────────────────
  // Idioma inicial: adivinado del navegador; el fetch de info lo corrige al idioma del huésped.
  L = (navigator.language||"").toLowerCase().indexOf("es")===0 ? "es" : "en";
  document.documentElement.lang=L;

  if(!token){ showMsg("🔗", "Stay Here PR", T.en.badToken, false); return; }

  // Pantallas de retorno: se muestran de inmediato (el pago ya ocurrió; no dependen de la red).
  if(status==="success"){ showMsg("✅", t().okTitle, t().okMsg, false); return; }
  if(status==="cancel"){ showMsg("↩️", t().cancelTitle, t().cancelMsg, true); return; }

  // Vista principal: pedimos idioma + detalles para mostrar servicio y precio antes de pagar.
  api({token:token, info:true}).then(function(res){
    var info = (res.ok && res.j && res.j.info) ? res.j.info : null;
    if(!info){
      if(res.status===404){ showMsg("🔗","Stay Here PR", t().badToken, false); }
      else if(res.status===422){ showMsg("ℹ️","Stay Here PR", t().noPrice, false); }
      else { showMsg("⚠️","Stay Here PR", t().genErr, false); }
      return;
    }
    L = info.language==="es" ? "es" : "en"; document.documentElement.lang=L;
    if(info.payStatus==="authorized"||info.payStatus==="captured"){ showMsg("✅", t().okTitle, t().okMsg, false); return; }
    renderForm(info);
  }).catch(function(){ showMsg("⚠️","Stay Here PR", t().genErr, false); });
})();
</script>
</body>
</html>
